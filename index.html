<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ════════════════════════════════════════════
   SHARED PRIMITIVES
   ════════════════════════════════════════════ */

const WIN95_FONT = "'Pixelated MS Sans Serif','MS Sans Serif','Microsoft Sans Serif',Tahoma,Arial,sans-serif";
/* Clean, non-pixelated font for long-form paragraph copy. */
const BODY_FONT = "'MS Sans Serif','Segoe UI',Tahoma,Geneva,Verdana,sans-serif";
const MONO_FONT = "'Courier New',monospace";
const MOBILE_BREAKPOINT = 900;

/* window.innerWidth alone is unreliable in embedded/iframe contexts that
   don't honor the viewport meta tag (it falls back to a ~980px desktop
   layout viewport on phones, silently shrinking everything instead of
   switching layouts). window.screen.width reflects the real device/
   screen size regardless, so treat either signal as authoritative. */
const checkIsMobile = () =>
  window.innerWidth <= MOBILE_BREAKPOINT || window.screen.width <= MOBILE_BREAKPOINT;

const useIsMobile = () => {
  const [isMobile, setIsMobile] = useState(checkIsMobile);
  useEffect(() => {
    const onResize = () => setIsMobile(checkIsMobile());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return isMobile;
};

/* ── Glowing outline button (replaces the old Win95 bevel button) ── */
const GlowBtn = ({ children, onClick, style = {}, disabled = false }) => {
  const [hov, setHov] = useState(false);
  return (
    <button
      disabled={disabled}
      onClick={onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        fontFamily: MONO_FONT, fontSize:11, fontWeight:'bold', letterSpacing:0.5,
        background: disabled ? 'transparent' : (hov ? 'rgba(255,79,216,0.18)' : 'rgba(77,217,232,0.08)'),
        color: disabled ? 'var(--mos-text-dim)' : 'var(--mos-text)',
        border: `1px solid ${disabled ? 'var(--mos-border-dark)' : (hov ? 'var(--mos-accent)' : 'var(--mos-accent-cyan)')}`,
        padding:'6px 14px', cursor: disabled ? 'default' : 'pointer', outline:'none',
        transition:'background 0.15s, border-color 0.15s',
        ...style,
      }}
    >{children}</button>
  );
};

/* ── Read-only field chip ── */
const FieldChip = ({ value }) => (
  <div style={{
    fontFamily: MONO_FONT, fontSize:11, background:'var(--mos-panel-deep)', color:'var(--mos-text)',
    padding:'5px 8px', border:'1px solid var(--mos-border-dark)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
  }}>{value}</div>
);

/* ── Small tag chip ── */
const Tag = ({ label, color = 'var(--mos-accent-blue)' }) => (

    fontFamily: MONO_FONT, fontSize:10, background: color, color:'#fff',

/* ════════════════════════════════════════════

   The Company was dropped at the user's request.
   Darkroom/Hangar/Terminal/Bin are wired up
   structurally (real position, real art) but have
   no panel content yet — selecting them shows an
   empty frame until that content is written.
   ════════════════════════════════════════════ */

const NAV_ITEMS = [

    pos:{ left:21.46, top:6.59,  width:58.84, height:10.95 } },
  { id:'ctf',      label:'CTF',      icon:'icons/mehos_icon_ctf.png',      rowNormal:'icons/spine_ctf_normal.png',      rowSelected:'icons/spine_ctf_selected.png',
    pos:{ left:20.05, top:14.05, width:61.10, height:10.57 } },
  { id:'research', label:'RESEARCH', icon:'icons/mehos_icon_research.png', rowNormal:'icons/spine_research_normal.png', rowSelected:'icons/spine_research_selected.png',
    pos:{ left:20.66, top:22.31, width:59.34, height:9.07 } },
  { id:'skills',   label:'SKILLS',   icon:'icons/mehos_icon_skills.png',   rowNormal:'icons/spine_skills_normal.png',   rowSelected:'icons/spine_skills_selected.png',

  { id:'contact',  label:'CONTACT',  icon:'icons/mehos_icon_contact.png',  rowNormal:'icons/spine_contact_normal.png',  rowSelected:'icons/spine_contact_selected.png',
    pos:{ left:21.66, top:44.89, width:57.33, height:9.45 } },
  { id:'darkroom', label:'DARKROOM', icon:'icons/mehos_icon_darkroom.png', rowNormal:'icons/spine_darkroom_normal.png', rowSelected:'icons/spine_darkroom_selected.png',
    pos:{ left:21.21, top:52.69, width:58.34, height:9.20 } },
  { id:'hangar',   label:'HANGAR',   icon:'icons/mehos_icon_hangar.png',   rowNormal:'icons/spine_hangar_normal.png',   rowSelected:'icons/spine_hangar_selected.png',
    pos:{ left:18.45, top:59.11, width:63.61, height:10.57 } },
  { id:'terminal', label:'TERMINAL', icon:'icons/mehos_icon_terminal.png', rowNormal:'icons/spine_terminal_normal.png', rowSelected:'icons/spine_terminal_selected.png',
    pos:{ left:20.56, top:67.37, width:59.84, height:9.45 } },
  { id:'bin',      label:'BIN',      icon:'icons/mehos_icon_bin.png',      rowNormal:'icons/spine_bin_normal.png',      rowSelected:'icons/spine_bin_selected.png',
    pos:{ left:21.46, top:75.54, width:58.34, height:8.70 } },
];

/* Bottom edge of the visible spine, as % of the full frame height. */
const SPINE_CROP_PCT = 100;

const PANEL_LABELS = {
  about:    'ABOUT://IDENTITY',
  ctf:      'CTF://PLACEMENTS',
  research: 'RESEARCH://WRITE-UPS',
  skills:   'SKILLS://LOADOUT',
  resume:   'RESUME://EXPORT',
  contact:  'CONTACT://CHANNELS',
  darkroom: 'DARKROOM://',
  hangar:   'HANGAR://',
  terminal: 'TERMINAL://',
  bin:      'BIN://',
};

/* ════════════════════════════════════════════
   CONTROL SPINE — fixed left nav
   ════════════════════════════════════════════ */

const SPINE_FRAME_W = 885, SPINE_FRAME_H = 1777;

const ConsoleSpine = ({ active, onSelect }) => {
  const width = 224;
  const fullHeight = width * (SPINE_FRAME_H / SPINE_FRAME_W);
  const visibleHeight = fullHeight * (SPINE_CROP_PCT / 100);
  return (
    <div style={{ width, height:visibleHeight, overflow:'hidden', flexShrink:0, userSelect:'none' }}>
      <div style={{
        position:'relative', width, height:fullHeight,
        backgroundImage:"url('icons/spine_frame_full.png')", backgroundSize:'100% 100%', backgroundRepeat:'no-repeat',
      }}>
        {NAV_ITEMS.map(item => {
          const isActive = item.id === active;
          const p = item.pos;
          return (
            <button
              key={item.id}
              onClick={() => onSelect(item.id)}
              style={{
                position:'absolute', left:`${p.left}%`, top:`${p.top}%`, width:`${p.width}%`, height:`${p.height}%`,
                border:'none', background:'none', padding:0, cursor:'pointer', lineHeight:0,
              }}
            >
              <img src={isActive ? item.rowSelected : item.rowNormal} style={{ width:'100%', height:'100%', display:'block' }} draggable={false} />
            </button>
          );
        })}
      </div>
    </div>
  );
};

/* Compact horizontal version for narrow viewports */
const ConsoleSpineMobile = ({ active, onSelect }) => (
  <div style={{
    display:'flex', overflowX:'auto', gap:6, padding:'8px 10px',
    background:'rgba(10,8,24,0.85)', borderBottom:'1px solid var(--mos-border-dark)',
    flexShrink:0, WebkitOverflowScrolling:'touch',
  }}>
    {NAV_ITEMS.map(item => {
      const isActive = item.id === active;
      return (
        <button

            display:'flex', flexDirection:'column', alignItems:'center', gap:3, flexShrink:0,

);

/* ════════════════════════════════════════════
   TERMINAL PANEL — persistent identity blurb

const TerminalPanel = () => (

      <div style={{ color:'var(--mos-text-dim)' }}>Offensive security · web &amp; Android app testing · reverse engineering · CTF competitor</div>
      <div style={{ color:'var(--mos-accent-cyan)', marginTop:8 }}>

/* ════════════════════════════════════════════
   CONTENT PANEL — dynamic, one per nav section
   ════════════════════════════════════════════ */

/* ── About ── */
const AboutPanelContent = () => {
  const avatarRef = useRef(null);
  useEffect(() => {
    const el = avatarRef.current; if (!el) return;
    const ctx = el.getContext('2d');
    const S = 5;
    const SK='#FDBCB4', H='#3D2314', EY='#111', SH='#1a3a7a', _=null, W='#fff', T='#e8a090';
    const face = [
      [_,_,H,H,H,H,H,H,_,_],
      [_,H,H,H,H,H,H,H,H,_],
      [_,H,SK,SK,SK,SK,SK,H,H,_],
      [_,H,SK,EY,SK,SK,EY,SK,H,_],
      [_,H,SK,SK,SK,SK,SK,SK,H,_],
      [_,H,SK,SK,T,T,SK,SK,H,_],
      [_,_,H,SK,W,W,SK,H,_,_],
      [_,_,H,H,H,H,H,H,_,_],
      [_,SH,SH,SH,SH,SH,SH,SH,_,_],
      [SH,SH,SH,SH,SH,SH,SH,SH,SH,_],
    ];
    ctx.clearRect(0,0,el.width,el.height);
    face.forEach((row,r) => row.forEach((col,c) => {
      if(!col) return;
      ctx.fillStyle = col;
      ctx.fillRect(c*S, r*S, S, S);
    }));
  }, []);

  return (
    <div style={{ fontFamily:BODY_FONT, fontSize:12, color:'var(--mos-text)' }}>
      <div style={{ display:'flex', gap:14, marginBottom:14, alignItems:'center' }}>
        <div style={{ flexShrink:0, border:'1px solid var(--mos-border-dark)', width:52, height:52, background:'var(--mos-panel-deep)', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
          <canvas ref={avatarRef} width={50} height={50} style={{ imageRendering:'pixelated' }} />
        </div>
        <div>
          <div style={{ fontFamily:MONO_FONT, fontSize:15, fontWeight:'bold', color:'#fff' }}>M3hDLL</div>
          <div style={{ color:'var(--mos-accent-cyan)', fontWeight:'bold', fontSize:12 }}>Information Security Analyst &amp; Penetration Tester</div>
        </div>
      </div>
      <div style={{ lineHeight:1.7, marginBottom:14 }}>
        Information security analyst and penetration tester with hands-on experience in web and Android application security, cloud security assessment, SIEM evaluation, and reverse engineering. Active CTF competitor and self-directed learner focused on offensive security. Comfortable across the stack from smali-level Android teardown to cloud IAM boundary analysis.
      </div>
      <div style={{ marginBottom:12 }}>
        <div style={{ fontFamily:MONO_FONT, fontSize:11, fontWeight:'bold', color:'var(--mos-accent)', marginBottom:6, letterSpacing:1 }}>PLATFORMS</div>
        <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
          {[
            { label:'HackTheBox', href:'https://app.hackthebox.com/' },
            { label:'CTFtime',    href:'https://ctftime.org/' },
            { label:'GitHub',     href:'https://github.com/meh-dll' },
            { label:'TryHackMe',  href:'https://tryhackme.com/' },
          ].map(p => (
            <GlowBtn key={p.label} onClick={() => window.open(p.href, '_blank')} style={{ fontSize:10, padding:'4px 10px' }}>{p.label}</GlowBtn>
          ))}
        </div>
      </div>
      <div>
        <div style={{ fontFamily:MONO_FONT, fontSize:11, fontWeight:'bold', color:'var(--mos-accent)', marginBottom:6, letterSpacing:1 }}>CORE COMPETENCIES</div>
        <div style={{ lineHeight:1.7 }}>
          Penetration testing &amp; technical report writing, security awareness programme delivery, SIEM deployment &amp; evaluation, AWS cloud security assessments, web application security testing, Android application reverse engineering, and cross-team vulnerability remediation.
        </div>
      </div>
    </div>
  );
};

/* ── Research ── */
const ResearchPanelContent = () => {
  const [selected, setSelected] = useState(0);
  const research = [
    {
      icon: '🔑',
      name: 'Android system provider credential exposure (CWE-798)',
      status: 'Informative', statusColor: '#a37f00',
      desc: "Reverse-engineered pre-installed ColorOS system applications on a current-generation Android device. Identified an exported system ContentProvider missing its signature readPermission, allowing any zero-permission application to read its backing database — which contained hard-coded production cloud credentials in cleartext.\n\nBuilt a zero-permission proof-of-concept app to confirm the read occurred at an untrusted application UID, then mapped the credential's full IAM access boundary read-only and non-destructively, deliberately stopping short of accessing any production data. Live credentials redacted.\n\nTechniques: exported-provider enumeration, permission-boundary comparison across sibling providers, ContentResolver PoC, IAM policy boundary analysis.\n\nDisclosure: reported to the vendor's bug bounty programme; closed as Informative (assessed as previously known to the vendor's security team).",

    },
    {
      icon: '🌐',
      name: 'Android deep-link WebView JSBridge exposure',
      status: 'Duplicate (confirmed)', statusColor: '#544a8c',

      tags: ['Android','WebView','Frida','Bug Bounty'],
    },
    {
      icon: '🛡️',
      name: 'SIEM platform evaluation (defensive)',
      desc: 'Ran a hands-on proof-of-concept evaluation of an enterprise AI-SIEM platform: built a structured assessment covering ~90 use cases across log ingestion, detection engineering, cloud posture, vulnerability management, and red-team activity, with console navigation paths and query examples, and flagged which capabilities required separate licensing beyond the trial.',
      tags: ['SIEM','Detection Engineering','Documentation'],
    },
    {
      icon: '🛰️',
      name: 'GAOFEN SAT Bot',
      date: 'Jul 2025 – Present',
      desc: 'Discord bot using Python (discord.py) that integrates OSINT tools for website analysis, image OCR, and social media lookups, plus a unique Street View location guessing game.',

  ];
  const item = research[selected];
  return (

      <div style={{ width:190, flexShrink:0, overflow:'auto', borderRight:'1px solid var(--mos-border-dark)', paddingRight:10 }}>
        {research.map((r, i) => (
          <div
            key={i}
            onClick={() => setSelected(i)}
            style={{

const playChoir = () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0.9;
  master.connect(ctx.destination);

  const voices = [
    { freq:261.63, det:-8  }, { freq:329.63, det:6   }, { freq:392.00, det:-4  },
    { freq:523.25, det:10  }, { freq:659.25, det:-6  }, { freq:783.99, det:4   },
    { freq:130.81, det:3   }, { freq:196.00, det:-10 },
  ];
  voices.forEach(({ freq, det }) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.detune.value = det;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 2.5);
    g.gain.setValueAtTime(0.15, ctx.currentTime + 9);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 14);
    osc.connect(g); g.connect(master);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 14);
  });
};

const HolyCVPreview = ({ onClose }) => {
  // Frame image: 764×900px. Inner transparent opening measured by pixel scan:
  // x: 158–609 (l=20.7%, r=79.7%)  y: 154–743 (t=17.1%, b=82.6%)
  const FRAME_ASPECT = 900 / 764;
  const INNER = { l: 0.207, t: 0.171, r: 0.797, b: 0.826 };

  const initW = 620;
  const initH = Math.round(initW * FRAME_ASPECT);

  const [pos, setPos] = useState(() => ({
    x: Math.max(20, Math.round((window.innerWidth - initW) / 2)),
    y: Math.max(10, Math.round((window.innerHeight - initH) / 2)),
  }));
  const [size, setSize] = useState({ w: initW, h: initH });

  const sizeRef = useRef({ w: initW, h: initH });
  const posRef = useRef(pos);
  const frameDragRef = useRef(null);
  const resizeDragRef = useRef(null);
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const sparklesRef = useRef([]);

  useEffect(() => { playChoir(); }, []);

  // Keep refs in sync
  useEffect(() => { sizeRef.current = size; }, [size]);
  useEffect(() => { posRef.current = pos; }, [pos]);

  // Resize canvas element when size changes
  useEffect(() => {
    const c = canvasRef.current;
    if (c) { c.width = size.w; c.height = size.h; }
  }, [size]);

  // Pixel sparkle animation — runs once, reads sizeRef for current dimensions
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.width = sizeRef.current.w;
    canvas.height = sizeRef.current.h;
    const ctx = canvas.getContext('2d');

    const makeSparkle = () => {
      const { w, h } = sizeRef.current;
      const bx = w * 0.22, by = h * 0.19;
      let x, y;
      const side = (Math.random() * 4) | 0;
      if (side === 0) { x = Math.random() * w; y = Math.random() * by; }
      else if (side === 1) { x = Math.random() * w; y = h - Math.random() * by; }
      else if (side === 2) { x = Math.random() * bx; y = Math.random() * h; }
      else               { x = w - Math.random() * bx; y = Math.random() * h; }
      const maxLife = (Math.random() * 50 + 20) | 0;
      return { x, y, sz: Math.random() * 3 + 1, life: maxLife, maxLife, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, hue: 38 + Math.random() * 28 };
    };

    sparklesRef.current = Array.from({ length: 120 }, makeSparkle);

    const tick = () => {
      const { w, h } = sizeRef.current;
      ctx.clearRect(0, 0, w, h);
      sparklesRef.current = sparklesRef.current.map(s => {
        const t = s.life / s.maxLife;
        const alpha = Math.sin(t * Math.PI);
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.fillStyle = `hsl(${s.hue},100%,${70 + alpha * 28 | 0}%)`;
        ctx.imageSmoothingEnabled = false;
        const px = Math.round(s.x), py = Math.round(s.y), sz = Math.ceil(s.sz);
        ctx.fillRect(px, py, sz, sz);
        // subtle outer glow pixel
        ctx.globalAlpha = alpha * 0.35;
        ctx.fillRect(px - 1, py - 1, sz + 2, sz + 2);
        ctx.restore();
        const next = { ...s, x: s.x + s.vx, y: s.y + s.vy, life: s.life - 1 };
        return next.life <= 0 ? makeSparkle() : next;
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
  }, []);

  // Global drag / resize handlers
  useEffect(() => {
    const onMove = e => {
      if (frameDragRef.current) {
        const { sx, sy, px, py } = frameDragRef.current;
        setPos({ x: px + e.clientX - sx, y: py + e.clientY - sy });
      }
      if (resizeDragRef.current) {
        const { sx, sw } = resizeDragRef.current;
        const newW = Math.max(300, sw + e.clientX - sx);
        setSize({ w: newW, h: Math.round(newW * FRAME_ASPECT) });
      }
    };
    const onUp = () => { frameDragRef.current = null; resizeDragRef.current = null; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, []);

  const startDrag = e => {
    if (e.button !== 0) return;
    e.preventDefault();
    frameDragRef.current = { sx: e.clientX, sy: e.clientY, px: posRef.current.x, py: posRef.current.y };
  };

  const iL = Math.round(size.w * INNER.l);
  const iT = Math.round(size.h * INNER.t);
  const iW = Math.round(size.w * (INNER.r - INNER.l));
  const iH = Math.round(size.h * (INNER.b - INNER.t));

  return (
    <div style={{ position:'fixed', inset:0, zIndex:99998, pointerEvents:'none' }}>
      {/* Dim overlay — no click-to-close */}
      <div style={{
        position:'absolute', inset:0,
        background:'radial-gradient(ellipse at center, rgba(255,220,80,0.1) 0%, rgba(0,0,0,0.72) 100%)',
        animation:'heavenFade 0.8s ease',
      }} />

      {/* God rays emanating from frame centre */}
      {[...Array(8)].map((_,i) => (
        <div key={i} style={{
          position:'absolute',
          left: pos.x + size.w / 2,
          top: pos.y + size.h / 2,
          width: 3, height: Math.max(window.innerHeight, window.innerWidth),
          background:'linear-gradient(to bottom, rgba(255,230,100,0.18), transparent)',
          transform:`translateX(-50%) rotate(${i * 45}deg)`,
          transformOrigin:'top center',
          pointerEvents:'none',
        }} />
      ))}

      {/* Frame + CV container */}
      <div
        onMouseDown={startDrag}
        style={{
          position:'absolute', left: pos.x, top: pos.y,
          width: size.w, height: size.h,
          cursor:'grab', pointerEvents:'all',
          animation:'holyRise 9s cubic-bezier(0.05,0.7,0.2,1) forwards',
          userSelect:'none',
          filter:'drop-shadow(0 0 30px rgba(255,200,0,0.85)) drop-shadow(0 0 70px rgba(255,140,0,0.5))',
        }}
      >
        {/* Pixel sparkle canvas (behind frame) */}
        <canvas ref={canvasRef} style={{ position:'absolute', inset:0, pointerEvents:'none', zIndex:1, imageRendering:'pixelated' }} />

        {/* CV content inside the transparent opening */}
        <div
          onMouseDown={e => e.stopPropagation()}
          style={{
            position:'absolute', left:iL, top:iT, width:iW, height:iH,
            overflow:'auto', background:'#fffff8', zIndex:2, cursor:'default',
          }}
        >
          <div style={{ padding:'18px 22px', fontFamily:'Georgia,serif' }}>
            <div style={{ textAlign:'center', borderBottom:'2px solid #c8a400', paddingBottom:10, marginBottom:14 }}>
              <div style={{ fontSize:17, fontWeight:'bold', letterSpacing:2 }}>M3hDLL</div>
              <div style={{ fontSize:10, color:'#555', marginTop:3, letterSpacing:1 }}>INFORMATION SECURITY ANALYST &amp; PENETRATION TESTER</div>
            </div>
            <div style={{ fontSize:9.5, lineHeight:1.7, color:'#333' }}>
              <div style={{ fontWeight:'bold', fontSize:10, color:'#8b6914', marginBottom:3, letterSpacing:1 }}>PROFILE</div>
              <p style={{ marginBottom:10 }}>Information security analyst and penetration tester with hands-on experience in web and Android application security, cloud security assessment, SIEM evaluation, and reverse engineering. Active CTF competitor and self-directed learner focused on offensive security.</p>
              <div style={{ fontWeight:'bold', fontSize:10, color:'#8b6914', marginBottom:3, letterSpacing:1 }}>CORE COMPETENCIES</div>
              <p style={{ marginBottom:10 }}>Penetration testing · Technical report writing · Security awareness programme delivery · SIEM deployment &amp; evaluation · AWS cloud security assessments · Web application security testing · Android application reverse engineering · Cross-team vulnerability remediation</p>
              <div style={{ fontWeight:'bold', fontSize:10, color:'#8b6914', marginBottom:3, letterSpacing:1 }}>PLATFORMS</div>
              <p>HackTheBox · CTFtime · GitHub · TryHackMe</p>
            </div>
            <div style={{ textAlign:'center', marginTop:14, fontSize:8.5, color:'#aaa', borderTop:'1px solid #e8d89a', paddingTop:7 }}>
              PDF (A4)
            </div>
          </div>
        </div>

        {/* Gold frame image — over CV, transparent center reveals CV */}
        <img
          src="icons/gold_frame.png"
          draggable={false}
          style={{ position:'absolute', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:3 }}
        />

        {/* Close button — top-right of frame border */}
        <div
          title="Close"
          onMouseDown={e => e.stopPropagation()}
          onClick={onClose}
          style={{
            position:'absolute', top:16, right:16,
            width:24, height:24, zIndex:10,
            background:'#8b0000', color:'#fff',
            border:'2px solid #fff',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:12, fontWeight:'bold', cursor:'pointer',
            fontFamily:WIN95_FONT, lineHeight:1,
            boxShadow:'1px 1px 0 #400000',
          }}
        >✕</div>

        {/* Resize handle — bottom-right corner */}
        <div
          onMouseDown={e => {
            e.stopPropagation(); e.preventDefault();
            resizeDragRef.current = { sx: e.clientX, sw: sizeRef.current.w };
          }}
          style={{
            position:'absolute', bottom:10, right:10,
            width:18, height:18, zIndex:10,
            cursor:'se-resize',
            background:'rgba(255,215,0,0.25)',
            border:'1px solid rgba(255,215,0,0.5)',

      </div>
    </div>
  );
};

    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = useCallback(() => {
    const panel = dragRef.current; if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  useEffect(() => {
    const onMsg = e => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const onDragStart = e => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = ev => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={() => setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

/* ════════════════════════════════════════════
   BOOT SCREEN (unchanged)
   ════════════════════════════════════════════ */

function playChime() {
  try {
    const ctx = new AudioContext();
    const master = ctx.createGain();
    master.gain.value = 0.35;
    master.connect(ctx.destination);
    [
      { f:523.25, t:0.0, d:1.4 },
      { f:659.25, t:0.65, d:1.4 },
      { f:783.99, t:1.25, d:1.8 },
      { f:1046.5, t:1.9,  d:0.7 },
      { f:880.0,  t:2.4,  d:2.8 },
    ].forEach(({ f, t, d }) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime + t);
      g.gain.linearRampToValueAtTime(0.55, ctx.currentTime + t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + d);
      osc.connect(g); g.connect(master);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + d + 0.1);
    });
  } catch (e) {}
}

/* Boot splash: the artwork (wordmark, flag, CRT scanlines, panel, labels,
   copyright/version) is the static image below — none of it is redrawn in
   HTML/CSS. Only the loading bar and its percentage are live: the baked
   region is masked with a black rectangle (the image's own background is
   already pure black, so the mask is invisible) and a segmented bar is
   drawn on top, positioned from the image's real pixel geometry. */
const BOOT_IMG_W = 1200, BOOT_IMG_H = 630;
/* Measured directly from icons/mehos_boot.jpg (fractions of image size),
   with a small pad to fully cover the baked pixels' anti-aliased edges. */
const BOOT_BAR_RECT = { left: 0.2342, top: 0.7873, width: 0.5850, height: 0.0524 };
const BOOT_PCT_RECT = { left: 0.8275, top: 0.7905, width: 0.0608, height: 0.0397 };

const BOOT_DURATION_MS = 3800;

const BootScreen = ({ onComplete }) => {
  const [loaded, setLoaded] = useState(false);
  const [progress, setProgress] = useState(0);
  const [imgRect, setImgRect] = useState(null);
  const imgRef = useRef(null);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const doneRef = useRef(false);

  const finish = useCallback(() => {
    if (doneRef.current) return;
    doneRef.current = true;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    setProgress(100);
    setLoaded(true);
    setTimeout(onComplete, 300);
  }, [onComplete]);

  useEffect(() => {
    playChime();
    const tick = now => {
      if (startRef.current === null) startRef.current = now;
      const pct = Math.min(100, ((now - startRef.current) / BOOT_DURATION_MS) * 100);
      setProgress(pct);
      if (pct >= 100) { finish(); return; }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [finish]);

  const measure = useCallback(() => {
    if (!imgRef.current) return;
    /* getBoundingClientRect() on an object-fit:contain <img> returns the
       element's own box, not the letterboxed visible image area — compute
       the actual "contain" rect from the box + the image's real aspect ratio. */
    const box = imgRef.current.getBoundingClientRect();
    const imgAspect = BOOT_IMG_W / BOOT_IMG_H;
    const boxAspect = box.width / box.height;
    let w, h;
    if (boxAspect > imgAspect) { h = box.height; w = h * imgAspect; }
    else { w = box.width; h = w / imgAspect; }
    const left = box.left + (box.width - w) / 2;
    const top = box.top + (box.height - h) / 2;
    setImgRect({ left, top, width: w, height: h });
  }, []);

  useEffect(() => {
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, [measure]);

  const skip = () => { doneRef.current = false; finish(); };

  const segCount = 34;
  const filledSegs = Math.round((progress / 100) * segCount);

  const rectStyle = (frac, padPx = 0) => imgRect ? {
    position: 'fixed',
    left: imgRect.left + frac.left * imgRect.width - padPx,
    top: imgRect.top + frac.top * imgRect.height - padPx,
    width: frac.width * imgRect.width + padPx * 2,
    height: frac.height * imgRect.height + padPx * 2,
  } : { display: 'none' };

  return (
    <div onClick={skip} style={{
      position:'fixed', inset:0,
      background:'#000',
      cursor:'default', userSelect:'none',
      opacity: loaded ? 0 : 1, transition:'opacity 0.3s ease',
      overflow:'hidden',
    }}>
      <img
        ref={imgRef}
        src="icons/mehos_boot.jpg"
        width={BOOT_IMG_W} height={BOOT_IMG_H}
        onLoad={measure}
        draggable={false}
        style={{ position:'absolute', inset:'16%', width:'68%', height:'68%', objectFit:'contain' }}
      />

      {/* Mask over the baked-in bar + percentage (blends into the image's own black bg) */}
      <div style={{ ...rectStyle(BOOT_BAR_RECT, 3), background:'#000' }} />
      <div style={{ ...rectStyle(BOOT_PCT_RECT, 3), background:'#000' }} />

      {/* Live segmented bar, drawn in place of the baked one */}
      {imgRect && (
        <div style={{ ...rectStyle(BOOT_BAR_RECT), display:'flex', alignItems:'center', gap:Math.max(1, imgRect.width * 0.0015) }}>
          {Array.from({ length: segCount }).map((_, i) => (
            <div key={i} style={{
              flex:1, alignSelf:'stretch',
              background: i < filledSegs ? '#0a12e6' : 'transparent',
              boxShadow: i < filledSegs ? 'inset 0 1px 0 rgba(160,180,255,0.6), inset 0 -2px 0 rgba(0,0,20,0.5)' : 'none',
            }} />
          ))}
        </div>
      )}

      {/* Live percentage counter, drawn in place of the baked "100%" */}
      {imgRect && (
        <div style={{
          ...rectStyle(BOOT_PCT_RECT),
          display:'flex', alignItems:'center', justifyContent:'flex-start',
          fontFamily:"'Courier New',monospace", fontWeight:'bold',
          fontSize: Math.max(10, imgRect.height * 0.045),
          color:'#39f2df', fontVariantNumeric:'tabular-nums',
        }}>
          {Math.round(progress)}%
        </div>
      )}

      <div style={{ position:'absolute', top:14, right:18, fontFamily:WIN95_FONT, fontSize:10, color:'rgba(150,190,255,0.6)' }}>
        Click to skip
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════
   MEHOS CONSOLE — main layout
   ════════════════════════════════════════════ */

const MehConsole = ({ tweaks }) => {
  const [activeSection, setActiveSection] = useState('ctf');
  const [showCVPreview, setShowCVPreview] = useState(false);
  const isMobile = useIsMobile();
  const [time, setTime] = useState('');
  const [uptime, setUptime] = useState('0m');
  const sessionStartRef = useRef(Date.now());

  useEffect(() => {
    const tick = () => {
      const now = new Date();
      setTime(tweaks.showClock ? now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }) : '');
      const mins = Math.floor((Date.now() - sessionStartRef.current) / 60000);
      const h = Math.floor(mins / 60), m = mins % 60;
      setUptime(h > 0 ? `${h}h ${m}m` : `${m}m`);
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [tweaks.showClock]);

  return (
    <div style={{
      position:'fixed', inset:0, overflow:'hidden', animation:'desktopReveal 0.6s ease',
      backgroundImage:"url('icons/mehos_console_bg.jpg')",
      backgroundSize:'cover', backgroundPosition:'center', backgroundRepeat:'no-repeat',
      display:'flex', flexDirection:'column',
    }}>
      {isMobile ? (
        <>
          <ConsoleSpineMobile active={activeSection} onSelect={setActiveSection} />
          <div style={{ flex:1, overflow:'auto', padding:12, display:'flex', flexDirection:'column', gap:12 }}>
            <TerminalPanel />
            <ContentPanel active={activeSection} onPreviewCV={() => setShowCVPreview(true)} />
            <BottomBar />
          </div>
        </>
      ) : (
        <div style={{ flex:1, display:'flex', padding:'18px', gap:14, minHeight:0 }}>
          <ConsoleSpine active={activeSection} onSelect={setActiveSection} />
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:12, minWidth:0, minHeight:0 }}>
            <TerminalPanel />
            <ContentPanel active={activeSection} onPreviewCV={() => setShowCVPreview(true)} />
            <BottomBar />
          </div>
          <StatusStack time={time} uptime={uptime} />
        </div>
      )}

      {showCVPreview && <HolyCVPreview onClose={() => setShowCVPreview(false)} />}
    </div>
  );
};

/* ════════════════════════════════════════════
   APP ROOT
   ════════════════════════════════════════════ */

const TWEAK_DEFAULTS = {
  showClock: true,
};

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [phase, setPhase] = useState('boot');

  return (
    <>
      {phase === 'boot'
        ? <BootScreen onComplete={() => setPhase('desktop')} />
        : <MehConsole tweaks={tweaks} />
      }
      {phase === 'desktop' && (
        <TweaksPanel>
          <TweakSection label="Console">
            <TweakToggle label="Show Clock" value={tweaks.showClock} onChange={v => setTweak('showClock', v)} />
          </TweakSection>
        </TweaksPanel>
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
